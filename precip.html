    const forecastData = {};
    const gridLayer = L.layerGroup().addTo(map);
    const usaBoxLayer = L.layerGroup().addTo(map);
    let currentHour = 0;

    function formatHourLabel(offset) {
      const now = new Date();
      now.setHours(now.getHours() + offset);
      return now.toLocaleTimeString([], { hour: 'numeric', hour12: true });
    }

    slider.addEventListener("input", () => {
      currentHour = parseInt(slider.value);
      hourLabel.textContent = currentHour === 0 ? "Now" : `${currentHour}h`;
      timeLabel.textContent = formatHourLabel(currentHour);
      drawGrid();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft" && slider.value > 0) {
        slider.value = parseInt(slider.value) - 1;
        slider.dispatchEvent(new Event('input'));
      } else if (e.key === "ArrowRight" && slider.value < 23) {
        slider.value = parseInt(slider.value) + 1;
        slider.dispatchEvent(new Event('input'));
      }
    });

    function getConditionColor(text) {
      const lower = text.toLowerCase();

      if (lower.includes("thunderstorms")) return "#064d00"; // very dark green
      if (lower.includes("showers") || lower.includes("chance of rain")) return "#1faa00"; // darker green
      if (lower.includes("scattered")) return "#5ee06a"; // medium bright green
      if (lower.includes("slight") || lower.includes("isolated") || lower.includes("drizzle")) return "#a8f0a2"; // light green

      if (lower.includes("cloudy") || lower.includes("overcast")) return "#888888"; // gray
      if (lower.includes("clear") || lower.includes("sunny") || lower.includes("partly cloudy") || lower.includes("mostly sunny")) return "#ffff66"; // yellow

      return null;
    }

    function conditionToIcon(condition) {
      const lower = condition.toLowerCase();
      if (lower.includes("patchy drizzle") || lower.includes("drizzle")) return "🌧️";
      if (lower.includes("patchy fog") || lower.includes("fog")) return "🌁";
      if (lower.includes("sunny") && !lower.includes("partly")) return "☀️";
      if (lower.includes("mostly sunny")) return "🌤️";
      if (lower.includes("partly sunny")) return "🌥️";
      if (lower.includes("partly cloudy")) return "⛅";
      if (lower.includes("mostly cloudy") || lower.includes("cloudy")) return "☁️";
      if (lower.includes("slight") || lower.includes("scattered") || lower.includes("isolated")) return "🌦️";
      if (lower.includes("showers") || lower.includes("thunderstorms")) return "⛈️";
      if (lower.includes("clear")) return "🌙";
      if (lower.includes("haze")) return "🌫️";
      if (lower.includes("smoke")) return "💨";
      return "❓";
    }

    async function fetchForecasts() {
      const fetches = locations.map(async (loc) => {
        try {
          const pointRes = await fetch(`https://api.weather.gov/points/${loc.lat},${loc.lon}`);
          const pointData = await pointRes.json();
          const hourlyUrl = pointData.properties.forecastHourly;
          const hourlyRes = await fetch(hourlyUrl);
          const hourlyData = await hourlyRes.json();
          forecastData[loc.name] = hourlyData.properties.periods;
        } catch (err) {
          console.error(`Error loading forecast for ${loc.name}`, err);
        }
      });

      await Promise.all(fetches);
      drawUSABox();
      drawGrid();
    }

    function drawUSABox() {
      usaBoxLayer.clearLayers();
      const usaBox = L.rectangle([
        [24.5, -125],
        [49.5, -66]
      ], {
        color: "#000",
        weight: 2,
        fill: false
      });
      usaBoxLayer.addLayer(usaBox);
    }

    function drawGrid() {
      gridLayer.clearLayers();
      const boxSize = 0.2;

      for (const loc of locations) {
        const periods = forecastData[loc.name];
        if (!periods || !periods[currentHour]) continue;

        const condition = periods[currentHour].shortForecast || "";
        const color = getConditionColor(condition);
        if (!color) continue;

        const rect = L.rectangle([
          [loc.lat - boxSize / 2, loc.lon - boxSize / 2],
          [loc.lat + boxSize / 2, loc.lon + boxSize / 2]
        ], {
          color: color,
          weight: 1,
          fillOpacity: 0.6
        });
        gridLayer.addLayer(rect);
      }
    }

    map.on("zoomend", () => {
      zoomDisplay.textContent = `Zoom: ${map.getZoom()}`;
    });

    fetchForecasts();
    setInterval(fetchForecasts, 30 * 60 * 1000); // refresh every 30 min
  </script>
</body>
</html>
